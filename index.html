<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>한성수 · 손민정 결혼합니다</title>
  <meta name="description" content="2027년 1월 24일 일요일 오전 11시, 소노펠리체컨벤션에서 결혼합니다.">
  <meta name="theme-color" content="#F8F7F3">

  <!-- 검색 결과에 노출되지 않도록 하는 설정입니다. (주소를 아는 사람만 접속하는 용도)
       검색에 나와도 괜찮다면 아래 한 줄을 지우세요. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- 카카오톡 등으로 링크를 공유할 때 나오는 미리보기 문구입니다. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="한성수 · 손민정 결혼합니다">
  <meta property="og:description" content="2027년 1월 24일 일요일 오전 11시 · 소노펠리체컨벤션">
  <!-- 미리보기 사진은 배포 주소가 정해진 뒤에 설정합니다. (README 의 '카카오톡 미리보기' 참고)
       아래 줄 앞뒤의 주석 표시를 지우고, 내GitHub아이디 부분을 실제 아이디로 바꾸세요.
  <meta property="og:image" content="https://내GitHub아이디.github.io/minjeong-seongsu-wedding/images/og.jpg">
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">

  <!-- 재방문이면 인트로가 번쩍 보이지 않도록 가장 먼저 확인합니다. (주소 끝에 ?intro=1 을 붙이면 인트로를 다시 볼 수 있어요) -->
  <script>
    (function () {
      try {
        var force = location.search.indexOf('intro=1') > -1;
        if (!force && localStorage.getItem('wedding-intro-seen-v1')) {
          document.documentElement.classList.add('intro-seen');
        }
      } catch (e) {}
    })();
  </script>
  <noscript><style>#intro { display: none; }</style></noscript>
</head>

<body>

  <!-- ===================== 인트로 ===================== -->
  <!-- 대표 사진 위에 글씨가 한 글자씩 나타나고, 이어서 날짜·예식장 정보가 나타납니다. -->
  <section id="intro" class="intro scene" aria-label="인트로">
    <div class="scene__media" id="intro-media"></div>
    <div class="scene__text">
      <p class="scene__title">
        <span class="sr-only" id="intro-title-sr"></span>
        <span id="intro-title" aria-hidden="true"></span>
      </p>
      <p class="scene__info" id="intro-info"></p>
    </div>
    <button type="button" class="intro__skip" id="intro-skip">건너뛰기</button>
  </section>

  <!-- ===================== 상단 헤더 ===================== -->
  <header class="site-header" id="site-header">
    <div class="site-header__inner">
      <a href="#" class="brand" id="brand" data-text="texts.headerTitle"></a>
      <button type="button" class="menu-btn" id="menu-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu" aria-label="메뉴 열기">
        <span class="menu-btn__bars" aria-hidden="true"><i></i><i></i></span>
      </button>
    </div>
  </header>

  <main id="main">

    <!-- 대표 사진(천천히 움직이는 모션 포토) + 글씨 + 날짜·예식장 -->
    <section id="hero" class="hero scene" tabindex="-1" aria-label="대표 사진">
      <div class="scene__media" id="hero-media"></div>
      <div class="scene__text">
        <h1 class="scene__title" id="hero-title"></h1>
        <p class="scene__info" id="hero-info"></p>
      </div>
    </section>

    <!-- 초대의 말 -->
    <section id="invite" class="section section--invite" tabindex="-1" aria-label="초대의 말">
      <p class="eyebrow">INVITATION</p>
      <p class="invite__text" data-text="texts.invitation"></p>
    </section>

    <!-- OUR MOMENTS -->
    <section id="moments" class="section" tabindex="-1" aria-labelledby="h-moments">
      <p class="eyebrow">OUR MOMENTS</p>
      <h2 class="section__title" id="h-moments">우리의 사진</h2>
      <div class="moments" id="moments-grid"></div>
      <button type="button" class="btn btn--block" id="btn-more-photos">사진 더 보기</button>
    </section>

    <!-- D-DAY -->
    <section id="countdown" class="section section--center" tabindex="-1" aria-label="D-Day 카운트다운">
      <p class="eyebrow">D-DAY</p>
      <div id="cd-live">
        <p class="cd__caption">전체 남은 일수</p>
        <p class="cd__total"><span id="cd-total">0</span><span class="cd__total-unit">일</span></p>
        <p class="cd__caption cd__caption--sub">달력 기준으로 나누면</p>
        <dl class="cd__grid">
          <div class="cd__cell"><dd id="cd-months">0</dd><dt>개월</dt></div>
          <div class="cd__cell"><dd id="cd-days">0</dd><dt>일</dt></div>
          <div class="cd__cell"><dd id="cd-hours">0</dd><dt>시간</dt></div>
          <div class="cd__cell"><dd id="cd-minutes">0</dd><dt>분</dt></div>
        </dl>
      </div>
      <p class="cd__message" id="cd-message" hidden></p>
    </section>

    <!-- 결혼식 안내 -->
    <section id="details" class="section" tabindex="-1" aria-labelledby="h-details">
      <p class="eyebrow">WEDDING DAY</p>
      <h2 class="section__title" id="h-details">결혼식 안내</h2>
      <div class="details">
        <p class="details__date" id="d-date"></p>
        <p class="details__time" id="d-time"></p>
        <p class="details__venue" id="d-venue"></p>
        <p class="details__hall" id="d-hall"></p>
        <p class="details__address" id="d-address"></p>
      </div>
      <div class="btn-row btn-row--3">
        <button type="button" class="btn" id="btn-copy-address">주소 복사</button>
        <button type="button" class="btn" id="btn-map">지도 보기</button>
        <button type="button" class="btn" id="btn-directions">길찾기</button>
      </div>

      <!-- 하객 안내: 유모차·휠체어, 식사·연회장, ATM (내용은 data.js 의 guide) -->
      <div class="acc-list acc-list--spaced" id="guide-list"></div>
    </section>

    <!-- 오시는 길 -->
    <section id="location" class="section" tabindex="-1" aria-labelledby="h-location">
      <p class="eyebrow">LOCATION</p>
      <h2 class="section__title" id="h-location">오시는 길</h2>

      <div class="loc">
        <p class="loc__name" id="loc-name"></p>
        <p class="loc__addr" id="loc-addr"></p>
      </div>

      <!-- 네이버 지도 화면. 누르면 네이버지도 앱에서 예식장이 열려요. -->
      <figure class="map" id="map-figure">
        <button type="button" class="map__btn" id="map-open" aria-label="네이버지도 앱에서 예식장 열기">
          <img id="map-img" alt="소노펠리체컨벤션 주변 지도" decoding="async" loading="lazy">
        </button>
      </figure>

      <div class="btn-row btn-row--3 btn-row--tight">
        <button type="button" class="btn" data-map="naver">네이버지도</button>
        <button type="button" class="btn" data-map="tmap">티맵</button>
        <button type="button" class="btn" data-map="kakao">카카오내비</button>
      </div>
      <p class="map__hint">버튼을 누르면 휴대폰의 지도 앱에서 예식장이 열려요.</p>

      <div class="acc-list" id="transport-list"></div>
    </section>

    <!-- 우리의 가족 -->
    <section id="family" class="section" tabindex="-1" aria-labelledby="h-family">
      <p class="eyebrow">FAMILY</p>
      <h2 class="section__title" id="h-family">우리의 가족</h2>
      <div class="rows">
        <button type="button" class="row" data-family="groom"><span data-text="families.groom.title"></span><span class="row__plus" aria-hidden="true">+</span></button>
        <button type="button" class="row" data-family="bride"><span data-text="families.bride.title"></span><span class="row__plus" aria-hidden="true">+</span></button>
      </div>
    </section>

    <!-- 마음 전하기 -->
    <section id="gift" class="section" tabindex="-1" aria-labelledby="h-gift">
      <p class="eyebrow">GIFT</p>
      <h2 class="section__title" id="h-gift">마음 전하기</h2>
      <div class="btn-row btn-row--2">
        <button type="button" class="btn" data-account="groom">신랑 측 계좌 보기</button>
        <button type="button" class="btn" data-account="bride">신부 측 계좌 보기</button>
      </div>
    </section>

    <!-- 마지막 감사 인사 -->
    <section id="closing" class="section section--closing" tabindex="-1" aria-label="감사 인사">
      <figure class="photo photo--closing" id="closing-photo"></figure>
      <p class="closing__names" data-text="texts.headerTitle"></p>
      <p class="closing__text" data-text="texts.closing"></p>
      <p class="closing__date" id="closing-date"></p>
    </section>

  </main>

  <!-- ===================== 메뉴 ===================== -->
  <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="메뉴" hidden>
    <div class="menu__backdrop" data-close></div>
    <nav class="menu__panel" aria-label="바로가기">
      <button type="button" class="menu__close" data-close aria-label="메뉴 닫기" data-autofocus>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <ul class="menu__list">
        <li><button type="button" data-menu-target="invite">초대의 말</button></li>
        <li><button type="button" data-menu-target="moments">우리의 사진</button></li>
        <li><button type="button" data-menu-target="details">결혼식 안내</button></li>
        <li><button type="button" data-menu-target="location">오시는 길</button></li>
        <li><button type="button" data-menu-target="family">우리의 가족</button></li>
        <li><button type="button" data-menu-target="gift">마음 전하기</button></li>
        <li><button type="button" data-menu-action="rsvp">참석 여부 전달</button></li>
      </ul>
    </nav>
  </div>

  <!-- ===================== 가족 · 계좌 팝업 ===================== -->
  <div class="modal" id="modal-info" role="dialog" aria-modal="true" aria-labelledby="info-title" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" tabindex="-1">
      <button type="button" class="modal__close" data-close aria-label="닫기">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <h2 class="modal__title" id="info-title"></h2>
      <div id="info-body"></div>
    </div>
  </div>

  <!-- ===================== 참석 여부(RSVP) 팝업 ===================== -->
  <div class="modal" id="modal-rsvp" role="dialog" aria-modal="true" aria-label="참석 여부 전달" data-backdrop-close="false" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" tabindex="-1">
      <button type="button" class="modal__close" data-close aria-label="닫기">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>

      <!-- 1단계: 안내 -->
      <div id="rsvp-step-intro">
        <p class="eyebrow">RSVP</p>
        <h2 class="modal__title modal__title--lead" data-text="texts.rsvpPrompt"></h2>
        <div class="stack">
          <button type="button" class="btn btn--solid btn--block" id="rsvp-start" data-autofocus>참석 여부 전달하기</button>
          <button type="button" class="btn btn--ghost btn--block" id="rsvp-later">나중에 하기</button>
        </div>
      </div>

      <!-- 2단계: 입력 -->
      <form id="rsvp-form" novalidate hidden>
        <p class="eyebrow">RSVP</p>
        <h2 class="modal__title">참석 여부 전달</h2>
        <p class="notice" id="rsvp-notice" hidden></p>

        <div class="field">
          <label for="rsvp-name">성함 <span class="req">필수</span></label>
          <input id="rsvp-name" name="name" type="text" maxlength="30" autocomplete="name" enterkeyhint="next" aria-describedby="err-name">
          <p class="field__error" id="err-name" role="alert"></p>
        </div>

        <fieldset class="field">
          <legend>참석 여부 <span class="req">필수</span></legend>
          <div class="choice-row">
            <label class="choice"><input type="radio" name="attend" value="yes"><span>참석</span></label>
            <label class="choice"><input type="radio" name="attend" value="no"><span>참석이 어려워요</span></label>
          </div>
          <p class="field__error" id="err-attend" role="alert"></p>
        </fieldset>

        <div id="rsvp-extra" hidden>
          <div class="field">
            <label for="rsvp-companions">동행 인원</label>
            <select id="rsvp-companions" name="companions"></select>
            <p class="field__hint">본인을 제외한 인원이에요.</p>
          </div>
          <fieldset class="field">
            <legend>식사 여부</legend>
            <div class="choice-row">
              <label class="choice"><input type="radio" name="meal" value="yes" checked><span>식사 예정</span></label>
              <label class="choice"><input type="radio" name="meal" value="no"><span>식사 안 함</span></label>
            </div>
          </fieldset>
        </div>

        <!-- 자동 입력 프로그램(봇) 방지용 칸입니다. 사람에게는 보이지 않아요. -->
        <div class="hp" aria-hidden="true">
          <label>웹사이트<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
        </div>

        <p class="field__error field__error--form" id="rsvp-error" role="alert"></p>
        <button type="submit" class="btn btn--solid btn--block" id="rsvp-submit">전달하기</button>
      </form>

      <!-- 3단계: 완료 -->
      <div id="rsvp-step-done" hidden>
        <p class="eyebrow">THANK YOU</p>
        <h2 class="modal__title modal__title--lead" data-text="texts.rsvpThanks"></h2>
        <button type="button" class="btn btn--block" id="rsvp-done-close" data-close>닫기</button>
      </div>
    </div>
  </div>

  <!-- ===================== 전체 화면 갤러리 ===================== -->
  <div class="gallery" id="gallery" role="dialog" aria-modal="true" aria-label="사진 갤러리" hidden>
    <div class="gallery__bar">
      <span class="gallery__count" id="gallery-count" aria-live="polite">01 / 01</span>
      <button type="button" class="gallery__close" id="gallery-close" aria-label="갤러리 닫기" data-autofocus>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="gallery__track" id="gallery-track"></div>
    <button type="button" class="gallery__nav gallery__nav--prev" id="gallery-prev" aria-label="이전 사진">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="gallery__nav gallery__nav--next" id="gallery-next" aria-label="다음 사진">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- 복사 완료 등 짧은 안내 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
